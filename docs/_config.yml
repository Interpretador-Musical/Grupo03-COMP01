title: Interpretador Musical
description: >-
  Uma linguagem de programação que vira música — projeto da disciplina de
  Compiladores 1 (Turma 01, Prof. Sérgio), FCTE/UnB.
lang: pt-BR

url: https://interpretador-musical.github.io
baseurl: /Grupo03-COMP01

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: musical

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

search_enabled: true
search:
  heading_level: 2
  previews: 3
  button: false

heading_anchors: true

mermaid:
  version: "11.4.1"

aux_links:
  Repositório no GitHub:
    - https://github.com/Interpretador-Musical/Grupo03-COMP01
aux_links_new_tab: true

callouts:
  aviso:
    title: Ainda em definição
    color: yellow
  nota:
    title: Nota
    color: blue

footer_content: >-
  Grupo 03 — Compiladores 1, FCTE/UnB.

back_to_top: true
back_to_top_text: "Voltar ao topo"

exclude:
  - README.md
