name: CI

# Roda em todo PR e em todo push para a main. É o que faz o resultado dos
# testes aparecer no próprio PR, em vez de depender de quem revisa compilar na
# mão para saber se algo quebrou.
on:
  pull_request:
  push:
    branches: [main]

# Um PR que recebe vários pushes seguidos só precisa do resultado do último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build e testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Sem fail-fast: quando quebra só em uma das plataformas, é justamente o
      # resultado da outra que diz se o problema é do código ou do ambiente.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instala Flex e Bison (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      # MUS_WERROR (CMP-12, #64): no CI, qualquer aviso do conjunto estrito
      # reprova. Roda nos dois compiladores, o GCC do Ubuntu e o clang do
      # macOS, que não acusam as mesmas coisas.
      - name: Configura
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMUS_WERROR=ON

      - name: Compila
        run: cmake --build build --parallel

      - name: Testes
        run: ctest --test-dir build --output-on-failure

  # Análise estática (CMP-12, #64). O comando e as duas supressões estão
  # justificados em docs/analise_estatica.md. A versão é a do apt do Ubuntu, e
  # é ela a referência: outra versão local pode achar coisas diferentes.
  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instala o Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      - name: Analisa src/
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --std=c++17 --language=c++ --inline-suppr --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=useStlAlgorithm --suppress=shadowFunction \
            -q -j "$(nproc)" -I src src

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instala Flex e Bison
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      # O NFR de concorrência da SCH-01 (#4) é a parte do projeto que um teste
      # comum não consegue verificar sozinho: uma corrida não falha toda vez.
      # A mesma opção do CMake que o docs/concorrencia.md manda usar localmente.
      - name: Configura com -fsanitize=thread
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON

      # O executável entra desde a SCH-08 (#46): é ele que roda a thread de
      # áudio de verdade ao lado da principal e, no --loop, da de tempo.
      - name: Compila a suíte e o executável
        run: cmake --build build-tsan --target mus_tests compilador --parallel

      - name: Roda a suíte instrumentada
        env:
          # halt_on_error faz o job falhar na primeira corrida detectada em vez
          # de enterrar o aviso no meio de uma saída que passou.
          TSAN_OPTIONS: halt_on_error=1
        run: ./build-tsan/tests/mus_tests

      # Sem placa de som no runner, o miniaudio cai no backend null, cujo
      # callback roda numa thread própria em tempo real: a reprodução é a
      # mesma de uma máquina com som, só que muda. Cada execução precisa
      # terminar com código 0 (o TSan com halt_on_error sai com 66) e imprimir
      # "dispositivo de áudio pronto": sem thread de áudio a execução não
      # provaria nada, e o "seguindo sem áudio" sai com 0 do mesmo jeito.
      - name: Toca os exemplos, a senoide e o --loop instrumentados
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          # O shell do Actions roda com -e: o código de saída é guardado em vez
          # de derrubar o passo antes de a saída ser impressa.
          confere() {
            local codigo=$1
            shift
            local falhou=0
            if [ "$codigo" -ne 0 ]; then
              echo "::error::saiu com código $codigo"
              falhou=1
            fi
            if grep -q "ThreadSanitizer" saida.txt; then
              echo "::error::o ThreadSanitizer relatou uma corrida"
              falhou=1
            fi
            if ! grep -m1 "dispositivo de áudio pronto" saida.txt; then
              echo "::error::o dispositivo de áudio não subiu"
              falhou=1
            fi
            for esperado in "$@"; do
              if ! grep -q "$esperado" saida.txt; then
                echo "::error::faltou \"$esperado\" na saída"
                falhou=1
              fi
            done
            if [ "$falhou" -ne 0 ]; then
              cat saida.txt
              exit 1
            fi
          }
          for exemplo in escala arpejo polirritmia; do
            echo "== exemplos/$exemplo.mus"
            codigo=0
            ./build-tsan/compilador -v "exemplos/$exemplo.mus" 2> saida.txt || codigo=$?
            confere "$codigo"
          done
          echo "== --test-tone"
          codigo=0
          ./build-tsan/compilador -v --test-tone 2> saida.txt || codigo=$?
          confere "$codigo"
          # O Ctrl+C chega como SIGINT; o tratador e as três threads (principal,
          # tempo e áudio) rodam juntos até ele. Com --preserve-status, o código
          # é o do compilador: 0 se o tratador encerrou o laço, 130 se o sinal
          # matou o processo. O "encerrado após" só sai depois do join.
          echo "== --loop"
          codigo=0
          timeout -s INT --preserve-status 3 ./build-tsan/compilador -v --loop 2> saida.txt || codigo=$?
          confere "$codigo" "encerrado após"

  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instala Flex e Bison
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      # A MAT-11 (#60) pede relatório limpo do ASAN, e é aqui que ele sai. Roda
      # no Linux porque o LeakSanitizer não existe no macOS: lá só os erros de
      # heap e pilha seriam pegos, não o vazamento. O UBSan vai junto porque a
      # instrumentação é compatível e pega estouro de inteiro e cast inválido
      # nos mesmos caminhos.
      - name: Configura com -fsanitize=address,undefined
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Compila
        run: cmake --build build-asan --parallel

      - name: Roda a suíte instrumentada
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/tests/mus_tests

      # A suíte chama o frontend direto; isto cobre o caminho do `main.cpp`. O
      # código de saída não serve de critério — `erros_semanticos.mus` falha de
      # propósito —, então o que reprova é qualquer relatório de sanitizer.
      - name: Roda os exemplos instrumentados
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          for exemplo in exemplos/*.mus; do
            ./build-asan/compilador --no-audio "$exemplo" 2> saida.txt || true
            if grep -q "Sanitizer" saida.txt; then
              cat saida.txt
              exit 1
            fi
          done
