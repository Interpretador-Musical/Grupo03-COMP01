name: Release Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      - name: Validar Release
        env:
          JOBS: "2"
        run: bash scripts/validar_release.sh
